services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: field_service_management
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
    ports: ["5432:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d field_service_management"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/field_service_management
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-password}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me-32chars}
      JWT_EXPIRATION_MINUTES: ${JWT_EXPIRATION_MINUTES:-120}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5174}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
      FLYWAY_ENABLED: "true"
      SLA_HOURS_LOW: ${SLA_HOURS_LOW:-72}
      SLA_HOURS_MEDIUM: ${SLA_HOURS_MEDIUM:-24}
      SLA_HOURS_HIGH: ${SLA_HOURS_HIGH:-8}
      SLA_HOURS_URGENT: ${SLA_HOURS_URGENT:-4}
      SLA_CHECK_DELAY_MS: ${SLA_CHECK_DELAY_MS:-300000}
      JPA_DDL_AUTO: validate
      JPA_SHOW_SQL: "false"
    ports: ["8080:8080"]
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend/fsm-frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080/api}
    ports: ["5174:80"]
    depends_on: [backend]

volumes:
  postgres_data:
