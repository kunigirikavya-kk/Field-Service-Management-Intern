name: End-to-End Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-e2e:
    name: Backend role lifecycle + PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run PostgreSQL-backed integration tests
        run: mvn -B -P e2e verify

  compose-smoke:
    name: Docker Compose stack smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Start stack
        env:
          POSTGRES_PASSWORD: e2e-postgres-password
          JWT_SECRET: e2e-jwt-secret-that-is-longer-than-32-characters
          CORS_ALLOWED_ORIGINS: http://localhost:5174
        run: docker compose up -d --build
      - name: Wait for API
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8080/api/health >/dev/null && exit 0
            sleep 3
          done
          docker compose logs backend db
          exit 1
      - name: Validate backend and frontend endpoints
        run: |
          set -euo pipefail
          curl -fsS http://localhost:8080/api/health
          echo
          curl -fsS http://localhost:8080/v3/api-docs >/dev/null
          curl -fsS http://localhost:5174/ | grep -q '<html'
          echo "API health, OpenAPI, and frontend are reachable."
      - name: Dump logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop stack
        if: always()
        run: docker compose down -v
