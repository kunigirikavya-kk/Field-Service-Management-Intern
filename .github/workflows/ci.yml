name: CI
on:
  push:
    branches: ["main","production-ready"]
  pull_request:
    branches: ["main"]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: mvn -B test
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend/fsm-frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/fsm-frontend/package-lock.json }
      - run: npm ci
      - run: npm run build
      - run: npm run lint
