# Server
server.port=${PORT:8080}
server.forward-headers-strategy=framework

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/field_service_management}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:local-dev-password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway migrations
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.jpa.open-in-view=false

# JWT
jwt.secret=${JWT_SECRET:local-development-secret-change-me-32chars}
jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:120}

# CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5174}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# SLA defaults (hours by priority; configurable per environment)
sla.hours.low=${SLA_HOURS_LOW:72}
sla.hours.medium=${SLA_HOURS_MEDIUM:24}
sla.hours.high=${SLA_HOURS_HIGH:8}
sla.hours.urgent=${SLA_HOURS_URGENT:4}

# Upload limits
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# Production-friendly logging
logging.level.root=${LOG_LEVEL:INFO}
